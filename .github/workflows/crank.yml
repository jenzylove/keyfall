name: crank

# The arena heartbeat: one long job ticks the bots every 30 s (harvest, resolve, NPC moves).
# A new run starts every 6 hours; concurrency queues it behind the running one.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Decide but send nothing"
        type: boolean
        default: false

concurrency:
  group: crank
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  crank:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        run: npm ci
        working-directory: app
      - name: Crank
        env:
          NPC_SEEDS: ${{ secrets.NPC_SEEDS }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          LOOP_SEC: "30"
          LOOP_MIN: "345"
        run: node scripts/crank-loop.mjs
      - name: Start the next heartbeat
        if: always() && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run crank.yml --ref main -R ${{ github.repository }}
