[package]
name = "qday-contract"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
repository = "https://github.com/jenzylove/qday"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
qday-core = { path = "../core" }
near-sdk = "5"
near-sys = "0.2"
serde_json = "1"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }
